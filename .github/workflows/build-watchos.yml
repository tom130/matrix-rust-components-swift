name: Build watchOS xcframework

on:
  workflow_dispatch:
    inputs:
      matrix_rust_sdk_ref:
        description: "matrix-rust-sdk git ref to build"
        required: true
        default: "4ca424f5f2ca61a72cbbd9d2a78c7acfb7811d0e"
  push:
    tags:
      - "*watchos.*"

env:
  MATRIX_RUST_SDK_REF: ${{ inputs.matrix_rust_sdk_ref || '4ca424f5f2ca61a72cbbd9d2a78c7acfb7811d0e' }}

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Check out package
        uses: actions/checkout@v4
        with:
          path: matrix-rust-components-swift

      - name: Check out matrix-rust-sdk
        uses: actions/checkout@v4
        with:
          repository: matrix-org/matrix-rust-sdk
          ref: ${{ env.MATRIX_RUST_SDK_REF }}
          path: matrix-rust-sdk

      - name: Report matrix-rust-sdk ref
        working-directory: matrix-rust-sdk
        run: git rev-parse HEAD

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo build outputs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            matrix-rust-sdk/target
          key: ${{ runner.os }}-watchos-xcframework-${{ hashFiles('matrix-rust-sdk/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-watchos-xcframework-

      - name: Build watchOS xcframework
        working-directory: matrix-rust-components-swift
        env:
          MATRIX_RUST_SDK_DIR: ${{ github.workspace }}/matrix-rust-sdk
        run: ./Tools/build_xcframework_watchos.sh

      - name: Zip xcframework
        working-directory: matrix-rust-components-swift/generated
        run: |
          ditto -c -k --sequesterRsrc --keepParent MatrixSDKFFI.xcframework MatrixSDKFFI.xcframework.zip
          shasum -a 256 MatrixSDKFFI.xcframework.zip > MatrixSDKFFI.xcframework.zip.sha256

      - name: Upload xcframework artifact
        uses: actions/upload-artifact@v4
        with:
          name: MatrixSDKFFI-watchos-xcframework
          path: |
            matrix-rust-components-swift/generated/MatrixSDKFFI.xcframework.zip
            matrix-rust-components-swift/generated/MatrixSDKFFI.xcframework.zip.sha256
